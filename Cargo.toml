[package]
name = "ferrothorn"
version = "0.1.0"
edition = "2021"
authors = ["Mayank Basena"]
description = "Blazing-fast async port scanner with service fingerprinting and OS detection"
license = "MIT"
repository = "https://github.com/mayank-dev-15/ferrothorn"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
colored = "2"
anyhow = "1"
thiserror = "1"
ipnetwork = "0.20"
rand = "0.8"
